name: Packages CI (deb & rpm)

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Build KeyDB source once on a stable base, then reuse for deb/rpm
  # ---------------------------------------------------------------
  build-source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      git_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          v=$(grep KEYDB_REAL_VERSION src/version.h | awk '{ printf $3 }' | tr -d '"')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "KeyDB version: $v"

      - name: Build KeyDB
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm autoconf automake \
            libjemalloc-dev tcl tcl-dev uuid-dev libcurl4-openssl-dev \
            libbz2-dev libzstd-dev liblz4-dev libsnappy-dev libssl-dev \
            pkg-config
          make -j"$(nproc)" BUILD_TLS=yes ENABLE_FLASH=yes
          cd src
          strip keydb-cli keydb-benchmark keydb-check-rdb keydb-check-aof \
                keydb-diagnostic-tool keydb-sentinel keydb-server

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: keydb-binaries
          path: src/keydb-{server,cli,benchmark,check-rdb,check-aof,diagnostic-tool,sentinel}

  # ---------------------------------------------------------------
  # deb: Ubuntu 20.04 / 22.04 / 24.04, Debian 11 / 12
  # ---------------------------------------------------------------
  build-deb:
    needs: build-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dist: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, debian-11, debian-12]

    container:
      image: ${{ matrix.dist }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: keydb-binaries
          path: src/

      - name: Install build deps
        run: |
          if [ -f /etc/debian_version ]; then
            apt-get update
            apt-get install -y devscripts dpkg-dev lsb-release
          fi

      - name: Build .deb packages
        run: |
          chmod +x pkg/deb/deb-buildsource.sh
          # The script expects to run from pkg/deb/
          cd pkg/deb
          # Adapt: we already have compiled binaries in src/, so build a
          # simplified deb directly using dpkg-deb
          VER="${{ needs.build-source.outputs.version }}"
          SHA="${{ needs.build-source.outputs.git_sha }}"
          ARCH=$(dpkg --print-architecture)
          DIST=$(lsb_release --codename --short)

          # Create package staging dir
          STAGE="keydb-${VER}-1.${DIST}-${ARCH}"
          mkdir -p "$STAGE/usr/bin" "$STAGE/etc/keydb" "$STAGE/usr/share/keydb" "$STAGE/DEBIAN"

          cp src/keydb-* "$STAGE/usr/bin/"
          cp keydb.conf "$STAGE/etc/keydb/" 2>/dev/null || cp ../..//keydb.conf "$STAGE/etc/keydb/" 2>/dev/null || true

          # control file
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: keydb
          Version: ${VER}-1
          Section: database
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: KlettIT <it@klett.de>
          Description: Multithreaded fork of Redis
           KeyDB is a fork of Redis designed for performance and scalability.
          EOF

          # postinst
          cat > "$STAGE/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if ! getent group keydb > /dev/null; then
              addgroup --system keydb
          fi
          if ! getent passwd keydb > /dev/null; then
              adduser --system --group --no-create-home keydb
          fi
          mkdir -p /var/lib/keydb /var/log/keydb
          chown -R keydb:keydb /var/lib/keydb /var/log/keydb
          exit 0
          EOF
          chmod 755 "$STAGE/DEBIAN/postinst"

          dpkg-deb --build "$STAGE"
          echo "=== Built package ==="
          ls -lh keydb_${VER}-1_${ARCH}.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: keydb-deb-${{ matrix.dist }}
          path: keydb_*.deb

  # ---------------------------------------------------------------
  # rpm: RHEL 8 / RHEL 9 / Fedora 40
  # ---------------------------------------------------------------
  build-rpm:
    needs: build-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: centos
            image: "centos:8"
            dist_tag: ".el8"
          - dist: centos
            image: "centos:9"
            dist_tag: ".el9"
          - dist: fedora
            image: "fedora:40"
            dist_tag: ".fc40"

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: keydb-binaries
          path: src/

      - name: Install build deps
        run: |
          if command -v yum &>/dev/null; then
            yum install -y rpm-build
          elif command -v dnf &>/dev/null; then
            dnf install -y rpm-build
          fi

      - name: Build .rpm packages
        run: |
          chmod +x pkg/rpm/generate_rpms.sh
          cd pkg/rpm
          # Patch the script to use pre-built binaries
          sed -i 's|cp \$DIR/../../src/|cp $DIR/../../src/|g' generate_rpms.sh 2>/dev/null
          # Build
          bash generate_rpms.sh 2>&1 || {
            # Fallback: manual rpmbuild
            echo "generate_rpms.sh failed, falling back to manual build..."
            VER="${{ needs.build-source.outputs.version }}"
            REL=1
            ARCH=$(uname -m)
            DIST="${{ matrix.dist_tag }}"
            SRC_DIR="keydb_build/keydb_rpm"

            mkdir -p /root/rpmbuild/BUILDROOT/keydb-${VER}-${REL}${DIST}.${ARCH}
            cp -r "$SRC_DIR"/* "/root/rpmbuild/BUILDROOT/keydb-${VER}-${REL}${DIST}.${ARCH}/"

            # Copy pre-built binaries
            cp src/keydb-server src/keydb-sentinel src/keydb-cli \
               src/keydb-benchmark src/keydb-check-aof src/keydb-check-rdb \
               src/keydb-diagnostic-tool \
               "/root/rpmbuild/BUILDROOT/keydb-${VER}-${REL}${DIST}.${ARCH}/usr/bin/"

            # Update spec file
            sed -i "2d" keydb_build/keydb.spec
            sed -i "1a\\Version     : ${VER}" keydb_build/keydb.spec
            sed -i "3d" keydb_build/keydb.spec
            sed -i "2a\\Release     : ${REL}${DIST}" keydb_build/keydb.spec

            rpmbuild -bb --buildroot "/root/rpmbuild/BUILDROOT/keydb-${VER}-${REL}${DIST}.${ARCH}" \
              keydb_build/keydb.spec
          }

          echo "=== Built RPM packages ==="
          find /root/rpmbuild -name "*.rpm" -o -name "keydb*.rpm" 2>/dev/null | head -5
          find . -name "*.rpm" 2>/dev/null | head -5

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: keydb-rpm-${{ matrix.dist }}-${{ matrix.dist_tag }}
          path: |
            /root/rpmbuild/RPMS/**/*.rpm
            rpm_files_generated/*.rpm
          if-no-files-found: warn
