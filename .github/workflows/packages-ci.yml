name: Packages CI (deb & rpm)

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build-source:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    outputs:
      version: ${{ steps.ver.outputs.version }}
      git_sha: ${{ github.sha }}
    steps:
      - name: Install Git + CA certs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: ver
        run: |
          v=$(grep KEYDB_REAL_VERSION src/version.h | awk '{ printf $3 }' | tr -d '"')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "KeyDB version: $v"

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential nasm autoconf automake \
            libjemalloc-dev tcl tcl-dev uuid-dev libcurl4-openssl-dev \
            libbz2-dev libzstd-dev liblz4-dev libsnappy-dev libssl-dev \
            pkg-config libgflags-dev libgoogle-glog-dev zlib1g-dev

      - name: Build KeyDB
        run: |
          make -j"$(nproc)" BUILD_TLS=yes ENABLE_FLASH=yes
          cd src
          strip keydb-cli keydb-benchmark keydb-check-rdb keydb-check-aof \
                keydb-diagnostic-tool keydb-sentinel keydb-server

      - name: Upload binaries + config
        uses: actions/upload-artifact@v4
        with:
          name: keydb-build
          path: |
            src/keydb-server
            src/keydb-cli
            src/keydb-benchmark
            src/keydb-check-rdb
            src/keydb-check-aof
            src/keydb-diagnostic-tool
            src/keydb-sentinel
            keydb.conf
            sentinel.conf

  build-deb:
    needs: build-source
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: keydb-build
          path: .

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev

      - name: Build .deb package
        run: |
          VER="${{ needs.build-source.outputs.version }}"
          ARCH=$(dpkg --print-architecture)
          # Use codename from /etc/os-release
          . /etc/os-release
          DIST="${VERSION_CODENAME}"
          [ -z "$DIST" ] && DIST="unknown"

          STAGE="keydb-${VER}-1.${DIST}-${ARCH}"
          mkdir -p "$STAGE/usr/bin" "$STAGE/etc/keydb" "$STAGE/DEBIAN"
          mkdir -p "$STAGE/usr/share/keydb"

          cp src/keydb-server src/keydb-cli src/keydb-benchmark \
             src/keydb-check-rdb src/keydb-check-aof \
             src/keydb-diagnostic-tool src/keydb-sentinel "$STAGE/usr/bin/"
          cp keydb.conf "$STAGE/etc/keydb/"
          cp sentinel.conf "$STAGE/etc/keydb/"

          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: keydb
          Version: ${VER}-1
          Section: database
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: KlettIT <it@klett.de>
          Description: Multithreaded fork of Redis
           KeyDB is a fork of Redis designed for performance and scalability.
          EOF

          cat > "$STAGE/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if ! getent group keydb > /dev/null; then
              addgroup --system keydb
          fi
          if ! getent passwd keydb > /dev/null; then
              adduser --system --group --no-create-home keydb
          fi
          mkdir -p /var/lib/keydb /var/log/keydb
          chown -R keydb:keydb /var/lib/keydb /var/log/keydb
          exit 0
          EOF
          chmod 755 "$STAGE/DEBIAN/postinst"

          dpkg-deb --build "$STAGE"
          echo "=== Built package ==="
          ls -lh keydb_${VER}-1_${ARCH}.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: keydb-deb-${{ matrix.dist }}
          path: keydb_*.deb

  build-rpm:
    needs: build-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: rockylinux
            image: "rockylinux:8"
            dist_tag: ".el8"
          - dist: rockylinux
            image: "rockylinux:9"
            dist_tag: ".el9"
          - dist: fedora
            image: "fedora:40"
            dist_tag: ".fc40"

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: keydb-build
          path: .

      - name: Install rpmbuild
        run: |
          if command -v yum &>/dev/null; then
            yum install -y rpm-build
          elif command -v dnf &>/dev/null; then
            dnf install -y rpm-build
          fi

      - name: Build .rpm package
        run: |
          VER="${{ needs.build-source.outputs.version }}"
          REL=1
          ARCH=$(uname -m)
          DIST="${{ matrix.dist_tag }}"

          BUILDROOT="/root/rpmbuild/BUILDROOT/keydb-${VER}-${REL}${DIST}.${ARCH}"
          mkdir -p "$BUILDROOT/usr/bin" \
                   "$BUILDROOT/usr/lib64/redis/modules" \
                   "$BUILDROOT/var/lib/keydb" \
                   "$BUILDROOT/var/log/keydb"

          cp src/keydb-server src/keydb-sentinel src/keydb-cli \
             src/keydb-benchmark src/keydb-check-aof src/keydb-check-rdb \
             src/keydb-diagnostic-tool \
             "$BUILDROOT/usr/bin/"

          # Build RPM using pkgbuild approach via rpm script
          SPECFILE=/tmp/keydb.spec
          cat > "$SPECFILE" <<EOF
          %define _build_id_links none
          %define _use_internal_dependencies 0

          Name     : keydb
          Version  : ${VER}
          Release  : ${REL}${DIST}%{?dist}
          Summary  : Multithreaded fork of Redis
          License  : BSD
          BuildArch: ${ARCH}

          %description
          KeyDB is a fork of Redis designed for performance and scalability.

          %prep
          # no prep needed - using pre-built binaries

          %build
          # no build needed - using pre-built binaries

          %install
          %files
          /usr/bin/keydb-server
          /usr/bin/keydb-sentinel
          /usr/bin/keydb-cli
          /usr/bin/keydb-benchmark
          /usr/bin/keydb-check-aof
          /usr/bin/keydb-check-rdb
          /usr/bin/keydb-diagnostic-tool
          /usr/lib64/redis/modules
          /var/lib/keydb
          /var/log/keydb

          %post
          if ! getent group keydb > /dev/null; then
              groupadd -r keydb
          fi
          if ! getent passwd keydb > /dev/null; then
              useradd -r -g keydb keydb
          fi
          chown -R keydb:keydb /var/lib/keydb /var/log/keydb

          %postun
          rm -rf /var/lib/keydb /var/log/keydb
          EOF

          # Point _buildtree to our BUILDROOT
          rpmbuild -bb --buildroot "$BUILDROOT" --define "_build_id_links none" \
            --define "_use_internal_dependencies 0" "$SPECFILE"

          echo "=== Built RPM packages ==="
          find /root/rpmbuild/RPMS -name "*.rpm" 2>/dev/null

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: keydb-rpm-${{ matrix.dist }}-${{ matrix.dist_tag }}
          path: /root/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: warn
